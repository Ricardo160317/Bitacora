<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora Diaria</title>
<style>html,body{margin:0;min-height:100%;background:#f5f0e7}body{font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#42563d;font-size:14px}</style>
</head>
<body>
<div class="boot">Cargando Bitácora…</div>
<script>
(function () {
  fetch('app-shell.html', { cache: 'no-store', credentials: 'same-origin' })
    .then(function (res) {
      if (!res.ok) throw new Error('No se pudo cargar la aplicación');
      return res.text();
    })
    .then(function (html) {
      var fidelityLink = '<link rel="stylesheet" href="visual-fidelity.css?v=2">';
      var alignmentLink = '<link rel="stylesheet" href="responsive-alignment.css?v=1">';
      html = html.replace('</head>', fidelityLink + '\n' + alignmentLink + '\n</head>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      document.body.innerHTML = '<div class="boot">No se pudo cargar la Bitácora. Recarga la página.</div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
